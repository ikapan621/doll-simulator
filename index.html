<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>墨魚吐司製造所｜娃包配件試搭室</title>
    <meta property="og:title" content="墨魚吐司製造所｜娃包配件試搭室">
    <style>
        body {
            font-family: Arial, sans-serif;
            margin: 0;
            padding: 0;
            background-color: #f5f5f5;
            display: flex;
            height: 100vh;
            box-sizing: border-box;
            overflow: hidden;
            position: relative;
        }

        /* 手機版頂部工具列 */
        .mobile-header {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 50px;
            background-color: #ffffff;
            box-shadow: 0 2px 5px rgba(0,0,0,0.1);
            z-index: 99;
            align-items: center;
            padding: 0 15px;
            box-sizing: border-box;
        }

        .toggle-btn {
            background-color: #ffb6c1;
            color: #fff;
            border: none;
            padding: 8px 14px;
            border-radius: 4px;
            cursor: pointer;
            font-weight: bold;
            font-size: 0.9rem;
        }

        /* 控制面板 */
        .control-panel {
            width: 360px;
            min-width: 360px;
            background-color: #ffffff;
            padding: 20px;
            box-shadow: 2px 0 5px rgba(0,0,0,0.1);
            display: flex;
            flex-direction: column;
            gap: 15px;
            overflow-y: auto;
            z-index: 100;
            transition: transform 0.3s ease;
        }

        .close-sidebar-btn {
            display: none;
            background-color: #ccc;
            color: #333;
            border: none;
            padding: 6px 12px;
            border-radius: 4px;
            align-self: flex-end;
            cursor: pointer;
        }

        h2 { margin: 0 0 5px 0; font-size: 1.4rem; color: #333; }
        .brand-heading { display: flex; align-items: center; gap: 10px; }
        .brand-heading h2 { margin: 0; min-width: 0; font-size: 1.15rem; line-height: 1.45; }
        .sidebar-heading { display: flex; align-items: center; justify-content: space-between; gap: 12px; }
        .sidebar-backdrop { display: none; }
        .canvas-viewport { flex: 0 0 auto; }
        .bag-options { display: flex; flex-direction: column; gap: 15px; }
        .mobile-bag-controls { display: none; }
        .creator-logo-button {
            flex: 0 0 44px;
            width: 44px;
            height: 44px;
            padding: 2px;
            border: 0;
            border-radius: 4px;
            background: #fff;
            cursor: pointer;
        }
        .creator-logo-button img { display: block; width: 100%; height: 100%; object-fit: contain; }
        .creator-logo-button:hover { background: #f5f5f5; }
        .creator-logo-button:focus-visible { outline: 2px solid #555; outline-offset: 2px; }
        .creator-dialog {
            width: min(340px, calc(100vw - 48px));
            box-sizing: border-box;
            max-height: calc(100dvh - 48px);
            overflow: auto;
            padding: 24px;
            border: 1px solid #ddd;
            border-radius: 8px;
            color: #333;
            background: #fff;
            box-shadow: 0 12px 40px rgba(0,0,0,0.18);
        }
        .creator-dialog::backdrop { background: rgba(0,0,0,0.35); }
        .creator-dialog-heading { display: flex; justify-content: space-between; align-items: center; gap: 12px; }
        .creator-dialog h2 { font-size: 1.15rem; margin: 0; }
        .creator-dialog p { margin: 18px 0 0; line-height: 1.6; overflow-wrap: anywhere; }
        .creator-dialog a { color: #355f68; text-underline-offset: 3px; }
        .creator-dialog-close {
            display: grid;
            place-items: center;
            width: 36px;
            height: 36px;
            padding: 0;
            border: 1px solid #ddd;
            border-radius: 4px;
            background: #fff;
            color: #444;
            font-size: 24px;
            cursor: pointer;
        }
        .row-group { display: flex; gap: 12px; width: 100%; }
        .row-group .control-group { flex: 1; }
        .control-group { display: flex; flex-direction: column; gap: 6px; }
        
        .dynamic-group {
            background-color: #f9f9f9;
            padding: 12px;
            border-radius: 6px;
            border-left: 4px solid #ffb6c1;
            display: flex;
            flex-direction: column;
            gap: 12px;
        }

        label { font-weight: bold; color: #555; font-size: 0.9rem; }
        select { padding: 8px; border-radius: 4px; border: 1px solid #ccc; font-size: 0.95rem; background-color: #fff; }
        /* 色票樣式 */
        .color-palette { display: flex; gap: 8px; flex-wrap: wrap; margin-top: 2px; }
        .color-swatch {
            width: 30px;
            height: 30px;
            border-radius: 4px;
            border: 2px solid #ccc;
            cursor: pointer;
            transition: transform 0.1s;
        }
        .color-swatch:hover { transform: scale(1.1); }
        .color-swatch.active { border-color: #333; box-shadow: 0 0 4px rgba(0,0,0,0.3); }
        .custom-color-swatch {
            position: relative;
            overflow: hidden;
            width: 76px;
            height: 34px;
            box-sizing: border-box;
            display: flex;
            align-items: center;
            justify-content: center;
            background: #fff;
            color: #4A4A4A;
            font-size: 0.9rem;
            font-weight: 700;
            line-height: 1;
            padding: 0;
            font-family: inherit;
        }
        .custom-color-input {
            position: absolute;
            inset: 0;
            width: 100%;
            height: 100%;
            margin: 0;
            padding: 0;
            border: 0;
            opacity: 0.01;
            cursor: pointer;
            font-size: 16px;
        }
        .custom-color-swatch:focus-within { outline: 2px solid #555; outline-offset: 2px; }
        .skin-color-input { width: 100%; height: 42px; padding: 3px; border: 1px solid #ddd; border-radius: 8px; background: #fff; cursor: pointer; }
        .custom-skin-row { display: none; }
        .custom-body-controls {
            display: none;
            flex-direction: column;
            gap: 10px;
            padding: 12px 0;
            border-top: 1px solid #eee;
            border-bottom: 1px solid #eee;
        }
        .custom-body-note { margin: 0; color: #777; font-size: 0.78rem; line-height: 1.4; }
        .custom-body-control { display: grid; grid-template-columns: 1fr auto; gap: 4px 10px; align-items: center; }
        .custom-body-control input[type="range"] { grid-column: 1 / -1; width: 100%; accent-color: #ff8fa3; }
        .custom-body-value { color: #777; font-size: 0.82rem; font-variant-numeric: tabular-nums; }
        .custom-bag-size-fields { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 12px; }
        .custom-bag-size-fields input {
            width: 100%;
            min-width: 0;
            box-sizing: border-box;
            padding: 8px;
            border: 1px solid #ccc;
            border-radius: 4px;
            background: #fff;
            color: #333;
            font: inherit;
            font-variant-numeric: tabular-nums;
        }
        .custom-bag-size-fields input:disabled { background: #eee; color: #888; }
        .custom-bag-preview-row { display: flex; align-items: center; justify-content: space-between; gap: 12px; }
        .custom-bag-switch {
            appearance: none;
            position: relative;
            flex: 0 0 44px;
            width: 44px;
            height: 26px;
            margin: 0;
            border: 1px solid #888;
            border-radius: 13px;
            background: #aaa;
            cursor: pointer;
        }
        .custom-bag-switch::before {
            content: '';
            position: absolute;
            top: 3px;
            left: 3px;
            width: 18px;
            height: 18px;
            border-radius: 50%;
            background: #fff;
            transition: transform 0.15s;
        }
        .custom-bag-switch:checked { background: #52796f; border-color: #52796f; }
        .custom-bag-switch:checked::before { transform: translateX(18px); }
        .custom-bag-switch:focus-visible { outline: 2px solid #555; outline-offset: 3px; }
        .custom-bag-switch:disabled { opacity: 0.45; cursor: default; }
        .custom-bag-error { margin: 0; color: #a22d36; font-size: 0.82rem; }
        .custom-bag-error:empty { display: none; }
        .custom-bag-measure {
            position: absolute;
            z-index: 30;
            pointer-events: none;
            transform-origin: center center;
            color: #b53e49;
            font-size: calc(12px / var(--preview-scale, 1));
            font-variant-numeric: tabular-nums;
        }
        .custom-bag-measure[hidden] { display: none; }
        .bag-measure-width { position: absolute; left: 0; right: 0; bottom: -15px; border-top: 1px solid currentColor; }
        .bag-measure-height { position: absolute; top: 0; bottom: 0; right: -15px; border-left: 1px solid currentColor; }
        .bag-measure-width::before, .bag-measure-width::after,
        .bag-measure-height::before, .bag-measure-height::after { content: ''; position: absolute; background: currentColor; }
        .bag-measure-width::before, .bag-measure-width::after { width: 1px; height: 8px; top: -4px; }
        .bag-measure-width::before { left: 0; }
        .bag-measure-width::after { right: 0; }
        .bag-measure-height::before, .bag-measure-height::after { height: 1px; width: 8px; left: -4px; }
        .bag-measure-height::before { top: 0; }
        .bag-measure-height::after { bottom: 0; }
        .bag-measure-value { position: absolute; white-space: nowrap; padding: 2px 4px; border-radius: 2px; background: rgba(255,255,255,0.94); line-height: 1.3; }
        .bag-measure-width .bag-measure-value { left: 50%; top: 4px; transform: translateX(-50%); }
        .bag-measure-height .bag-measure-value { left: 6px; top: 50%; transform: translateY(-50%); }
        .reset-custom-body {
            min-height: 36px;
            border: 1px solid #ccc;
            border-radius: 4px;
            background: #fff;
            color: #444;
            cursor: pointer;
        }
        #custom-body-host { position: absolute; inset: 0; z-index: 1; pointer-events: none; }

        /* 右側畫布區 */
        .display-area {
            flex: 1;
            background-color: #ffffff;
            display: flex;
            justify-content: center;
            align-items: center;
            overflow: auto;
            padding: 20px;
        }

        .preview-layout {
            display: flex;
            align-items: center;
            gap: 20px;
        }

        .reference-gallery {
            display: grid;
            gap: 12px;
            width: 190px;
        }

        .reference-gallery[hidden] { display: none; }

        .reference-slot {
            width: 190px;
            aspect-ratio: 1;
            overflow: hidden;
            border: 1px solid #ccc;
            background: #fafafa;
            padding: 0;
            cursor: zoom-in;
        }

        .reference-slot:focus-visible { outline: 2px solid #555; outline-offset: 3px; }
        .reference-lightbox {
            position: fixed;
            inset: 0;
            width: 100vw;
            height: 100dvh;
            max-width: none;
            max-height: none;
            margin: 0;
            padding: 56px 24px;
            box-sizing: border-box;
            border: 0;
            background: transparent;
        }
        .reference-lightbox[open] { display: grid; place-items: center; }
        .reference-lightbox::backdrop { background: rgba(70,70,70,0.35); }
        .reference-lightbox img {
            display: block;
            max-width: 100%;
            max-height: calc(100dvh - 112px);
            width: auto;
            height: auto;
            object-fit: contain;
            box-shadow: 0 8px 30px rgba(0,0,0,0.18);
        }
        .reference-lightbox-close { position: absolute; top: 12px; right: 16px; width: 40px; height: 40px; }

        .reference-slot img {
            display: block;
            width: 100%;
            height: 100%;
            object-fit: contain;
        }

        /* 畫布固定 550x550，內部所有圖層全部 1:1 滿版絕對定位重疊，網頁絕不干涉你的圖檔原位置 */
        .canvas {
            position: relative;
            width: 550px;
            height: 550px;
            min-width: 550px;
            min-height: 550px;
            border: 2px solid #ccc;
            background-color: #fafafa;
            background-image: 
                linear-gradient(to right, #e8e8e8 1px, transparent 1px),
                linear-gradient(to bottom, #e8e8e8 1px, transparent 1px);
            background-size: 20px 20px;
        }

        .doll-stage { position: relative; width: 100%; height: 100%; }
        .doll-skin-fill {
            position: absolute;
            inset: 0;
            z-index: 0;
            background-color: #e3d2b9;
            pointer-events: none;
        }

        /* 1:1 圖層完美標準定位：寬高完全死鎖 100%，起點全部 (0,0)，直接疊加 */
        .layer-img {
            position: absolute;
            width: 100%;
            height: 100%;
            object-fit: contain;
            top: 0;
            left: 0;
            pointer-events: none;
        }

        /* 頂層純黑線稿：使用正片疊底（multiply）完美與底下的顏色層融合，不擴散、不溢出 */
        .lineart-overlay {
            mix-blend-mode: multiply;
            z-index: 25;
        }

        .bag-layer {
            position: absolute;
            top: 0;
            left: 0;
            width: auto;
            height: auto;
            pointer-events: none;
            transform-origin: center center;
        }

        .strap-layer {
            position: absolute;
            z-index: 8;
            border-radius: 999px;
            pointer-events: none;
            transform-origin: left center;
        }

        /* 表情工藝加工濾鏡（基於 cat_face_black.png 轉換） */
        .face-emboss       { filter: opacity(0.4) contrast(0.7) brightness(1.2); mix-blend-mode: multiply; }          /* 壓印：半透明自然凹陷感 */
        .face-foil-gold    { filter: invert(34%) sepia(87%) saturate(464%) hue-rotate(5deg) brightness(110%) contrast(93%); } /* 燙金-金 */
        .face-foil-silver  { filter: invert(80%) sepia(0%) saturate(0%) hue-rotate(0deg) brightness(105%) contrast(90%); }    /* 燙金-銀 */
        .face-foil-rose    { filter: invert(40%) sepia(30%) saturate(400%) hue-rotate(320deg) brightness(105%) contrast(90%); } /* 玫瑰金 */
        .face-foil-black   { filter: invert(0%) sepia(0%) saturate(0%) hue-rotate(0deg) brightness(10%) contrast(100%); }      /* 燙金-黑 */

        @media (max-width: 768px), (max-width: 1024px) and (pointer: coarse) {
            body {
                flex-direction: column;
                height: 100vh;
                height: 100dvh;
                padding-top: calc(64px + env(safe-area-inset-top));
            }
            .mobile-header {
                display: flex;
                justify-content: space-between;
                gap: 12px;
                height: calc(64px + env(safe-area-inset-top));
                padding: env(safe-area-inset-top) 12px 0;
            }
            .mobile-brand { display: flex; align-items: center; gap: 8px; min-width: 0; color: #333; }
            .mobile-brand img { width: 32px; height: 32px; flex: 0 0 32px; object-fit: contain; }
            .mobile-brand span { font-size: 14px; font-weight: 700; line-height: 1.4; }
            .mobile-brand small { display: block; font-size: 12px; font-weight: 400; color: #666; }
            .toggle-btn { min-height: 44px; flex-shrink: 0; color: #5b4636; background: #ead8c5; }
            .sidebar-backdrop {
                display: block;
                position: fixed;
                inset: 0;
                z-index: 99;
                border: 0;
                padding: 0;
                background: rgba(0,0,0,0.28);
            }
            .sidebar-backdrop[hidden] { display: none; }
            .control-panel {
                position: fixed; top: 0; left: 0;
                width: min(400px, calc(100vw - 24px));
                min-width: 0;
                height: 100vh;
                height: 100dvh;
                box-sizing: border-box;
                padding: 16px;
                padding-top: max(16px, env(safe-area-inset-top));
                padding-bottom: max(24px, env(safe-area-inset-bottom));
                overflow-x: hidden;
                overflow-y: scroll;
                overscroll-behavior-y: contain;
                -webkit-overflow-scrolling: touch;
                scrollbar-gutter: stable;
                scrollbar-width: thin;
                scrollbar-color: #888 #eee;
                transform: translateX(-100%); box-shadow: 4px 0 10px rgba(0,0,0,0.2);
            }
            .control-panel > * { flex-shrink: 0; }
            .control-panel::-webkit-scrollbar { width: 8px; }
            .control-panel::-webkit-scrollbar-track { background: #eee; }
            .control-panel::-webkit-scrollbar-thumb { background: #888; border-radius: 4px; }
            .control-panel.open { transform: translateX(0); }
            .sidebar-heading {
                position: sticky;
                top: -16px;
                z-index: 2;
                background: #fff;
                padding: 12px 0;
                margin-top: -12px;
                box-shadow: 0 6px 6px #fff;
            }
            .sidebar-heading .brand-heading { gap: 8px; }
            .sidebar-heading h2 { font-size: 16px; }
            .sidebar-heading h2 span { display: block; white-space: nowrap; }
            .sidebar-heading h2 .brand-separator { display: none; }
            .sidebar-heading h2 wbr { display: none; }
            .close-sidebar-btn {
                display: grid;
                place-items: center;
                align-self: center;
                flex: 0 0 44px;
                width: 44px;
                height: 44px;
                padding: 0;
                font-size: 26px;
                color: #444;
                background: #fff;
                border: 1px solid #ddd;
            }
            .control-panel .control-group, .bag-options .control-group { min-width: 0; }
            .control-panel select, .bag-options select, .custom-bag-size-fields input { min-height: 44px; font-size: 16px; box-sizing: border-box; width: 100%; min-width: 0; }
            .control-panel .reset-custom-body, .bag-options .reset-custom-body, .skin-color-input { min-height: 44px; }
            #custom-bag-upload { max-width: 100%; min-height: 44px; }
            #custom-bag-upload::file-selector-button { min-height: 40px; }
            .color-swatch { width: 40px; height: 40px; box-sizing: border-box; flex: 0 0 40px; }
            .custom-color-swatch { width: 88px; height: 40px; flex-basis: 88px; }
            .custom-bag-preview-row { min-height: 44px; }
            .display-area {
                display: block;
                width: 100%;
                height: auto;
                min-height: 0;
                min-width: 0;
                box-sizing: border-box;
                padding: 12px 12px max(16px, env(safe-area-inset-bottom));
                overflow-x: hidden;
                overflow-y: auto;
                overscroll-behavior: contain;
            }
            .preview-layout { flex-direction: column; width: 100%; gap: 12px; }
            .canvas-viewport { position: relative; }
            .canvas { position: absolute; top: 0; left: 0; transform-origin: top left; }
            .reference-gallery {
                grid-template-columns: repeat(3, minmax(0, 1fr));
                width: 100%;
                gap: 8px;
            }
            .reference-slot { width: 100%; min-width: 0; box-sizing: border-box; }
            .bag-section-divider, #desktop-bag-options-host { display: none; }
            .control-panel.open .bag-section-divider, .control-panel.open #desktop-bag-options-host { display: block; }
            .mobile-bag-controls {
                display: block;
                width: 100%;
                box-sizing: border-box;
                border: 1px solid #d8d8d8;
                border-radius: 4px;
                background: #fff;
            }
            .mobile-bag-controls summary {
                min-height: 48px;
                box-sizing: border-box;
                padding: 14px 12px;
                color: #4A4A4A;
                font-size: 15px;
                font-weight: 700;
                line-height: 20px;
                cursor: pointer;
            }
            .mobile-bag-controls summary::marker { color: #80634e; }
            .mobile-bag-controls summary:focus-visible { outline: 2px solid #80634e; outline-offset: -2px; }
            .mobile-bag-controls[open] summary { border-bottom: 1px solid #eee; }
            #mobile-bag-options-host { padding: 12px; }
            .mobile-bag-controls .dynamic-group { background: transparent; border: 0; border-radius: 0; padding: 0; }
            .bag-options.has-cat-pattern { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 12px; }
            .has-cat-pattern > .control-group { grid-column: 1; grid-row: 1; }
            .has-cat-pattern #dynamic-options { display: contents; }
            .has-cat-pattern #dynamic-options > * { grid-column: 1 / -1; }
            .has-cat-pattern #dynamic-options > .cat-pattern-control { grid-column: 2; grid-row: 1; }
            .has-cat-pattern #dynamic-options > .hardware-control { grid-column: 1; }
            .has-cat-pattern #dynamic-options > .finishing-control { grid-column: 2; }
        }
        @media (prefers-reduced-motion: reduce) {
            .control-panel { transition: none; }
        }
    </style>
</head>
<body>

    <div class="mobile-header">
        <div class="mobile-brand"><img src="creator-logo.png" alt="" width="32" height="32"><span>墨魚吐司製造所<small>娃包配件試搭室</small></span></div>
        <button class="toggle-btn" id="settings-toggle" aria-expanded="false" aria-controls="sidebar" onclick="toggleSidebar()">☰ 設定</button>
    </div>
    <button class="sidebar-backdrop" id="sidebar-backdrop" type="button" aria-label="關閉設定選單" tabindex="-1" hidden onclick="toggleSidebar(false)"></button>
    <div class="control-panel" id="sidebar">
        <div class="sidebar-heading">
        <div class="brand-heading">
            <button class="creator-logo-button" id="creator-info-open" type="button" aria-label="製作者資訊" title="製作者資訊" aria-haspopup="dialog" aria-controls="creator-info-dialog">
                <img src="creator-logo.png" alt="墨魚吐司 LOGO" width="44" height="44">
            </button>
            <h2><span>墨魚吐司製造所</span><span class="brand-separator">｜</span><wbr><span>娃包配件試搭室</span></h2>
        </div>
        <button class="close-sidebar-btn" type="button" aria-label="收起選單" title="收起選單" onclick="toggleSidebar(false)">&times;</button>
        </div>
        <hr style="border: 0; border-top: 1px solid #eee; margin: 0;">
        
        <div class="row-group">
            <div class="control-group">
                <label for="main-category">素體類型</label>
                <select id="main-category" onchange="updateSubCategory()">
                    <option value="12分" selected>12分娃</option>
                    <option value="棉花娃">棉花娃</option>
                </select>
            </div>
            <div class="control-group">
                <label for="skin-preset">膚色</label>
                <select id="skin-preset" onchange="handleSkinPresetChange()">
                    <option value="normal" selected>普肌</option>
                    <option value="white">白肌</option>
                    <option value="custom">自訂膚色</option>
                </select>
            </div>
        </div>
        <div id="custom-skin-row" class="control-group custom-skin-row">
            <label for="custom-skin-color">自訂膚色</label>
            <input id="custom-skin-color" class="skin-color-input" type="color" value="#e3d2b9" oninput="applySkinColor(this.value)">
        </div>

        <div class="control-group">
            <label for="sub-category">素體款式</label>
            <select id="sub-category" onchange="onDollOrBagChange()">
                </select>

            <p class="custom-body-note">OB11 線稿參考版。數值為估算公分，預覽不取代實測。</p>
            <div class="custom-body-control">

                <input id="custom-upper-arm" type="range" min="-5" max="5" step="0.1" value="0">
            </div>
            <div class="custom-body-control">
                <label for="custom-forearm">下臂長</label>
                <span class="custom-body-value"><span id="custom-forearm-value">1.0 (+0.0)</span> cm</span>
                <input id="custom-forearm" type="range" min="-5" max="5" step="0.1" value="0">
            </div>
            <div class="custom-body-control">
                <label for="custom-thigh">大腿長</label>
                <span class="custom-body-value"><span id="custom-thigh-value">1.2 (+0.0)</span> cm</span>
                <input id="custom-thigh" type="range" min="-5" max="5" step="0.1" value="0">

                <canvas id="layer-main-color" class="bag-layer" width="397" height="316" style="z-index:10;"></canvas>

                <canvas id="layer-tuxedo-color" class="bag-layer" width="397" height="316" style="z-index:11; display:none;"></canvas>

                <canvas id="layer-hardware" class="bag-layer" width="397" height="316" style="z-index:18;"></canvas>

                <img id="layer-main-line" class="bag-layer lineart-overlay" style="z-index:20;" src="" alt="">
                <img id="layer-tuxedo-line" class="bag-layer lineart-overlay" style="z-index:21; display:none;" src="" alt="">

                    <div class="bag-measure-width"><span id="custom-bag-width-label" class="bag-measure-value"></span></div>

        <aside id="reference-gallery" class="reference-gallery" aria-label="實品參考圖片" hidden>
            <button class="reference-slot" type="button" aria-label="放大包包實品參考圖一" aria-haspopup="dialog" aria-controls="reference-lightbox"><img id="reference-image-1" loading="lazy" alt="包包實品參考圖一"></button>
            <button class="reference-slot" type="button" aria-label="放大包包實品參考圖二" aria-haspopup="dialog" aria-controls="reference-lightbox"><img id="reference-image-2" loading="lazy" alt="包包實品參考圖二"></button>
            <button class="reference-slot" type="button" aria-label="放大對應素體實品參考圖" aria-haspopup="dialog" aria-controls="reference-lightbox"><img id="reference-image-3" loading="lazy" alt="對應素體實品參考圖"></button>

    <script>
        const paletteColors = [
            { name: '原皮色', hex: '#d4a373' },
            { name: '馬鞍棕', hex: '#b57c4c' },
            { name: '櫻花粉', hex: '#ffb6c1' },
            { name: '經典黑', hex: '#212529' },
            { name: '象牙白', hex: '#f8f9fa' },
            { name: '復古紅', hex: '#ae2012' },
            { name: '午夜藍', hex: '#1a5f7a' },
            { name: '森林綠', hex: '#52796f' },
            { name: '奶油黃', hex: '#e9c46a' },
            { name: '薰衣草', hex: '#b8a1c9' }
        ];
        const hardwareColors = {
            'hw-gold': '#ffe898',
            'hw-silver': '#d4d5d7',
            'hw-bronze': '#6f6446',
            'hw-black': '#424039'
        };

        let currentMainColor = '#d4a373';
        let currentCylinderColor = '#f8f9fa';
        let currentTuxedoColor = '#f8f9fa';
        let currentHardware = 'hw-gold';
        let currentExpression = 'face-none';
        let currentCatPattern = 'pure';
        let customBagUrl = '';
        let customBagNaturalWidth = 0;
        let customBagNaturalHeight = 0;
        let customBagScale = 1;
        let customBagShowDimensions = false;
        let customBagUploadVersion = 0;
        let customBagUploadError = '';
        const STANDARD_CANVAS_SIZE_PX = 550;
        const LARGE_CANVAS_SIZE_PX = Math.round(STANDARD_CANVAS_SIZE_PX * (3262 / 2254));
        const OB11_REFERENCE_HEIGHT_CM = 12.5;
        const STANDARD_PX_PER_CM = (STANDARD_CANVAS_SIZE_PX * 0.6767) / OB11_REFERENCE_HEIGHT_CM;
        const bagStyleConfigs = {
            cat: { imageRatio: 397 / 316, strapAnchor: { xRatio: 0.045, yRatio: 0.04 }, strapColor: null },
            toast: { imageRatio: 378 / 354, strapAnchor: { xRatio: 0.064, yRatio: 0.22 }, strapColor: '#481502' },
            mini_messenger: { imageRatio: 383 / 363, strapAnchor: { xRatio: 0.075, yRatio: 0.025 }, strapColor: null },
            cylinder: { imageRatio: 330 / 263, strapAnchor: { xRatio: 0.075, yRatio: 0.08 }, strapColor: null }
        };
        const STRAP_WIDTH_CM = 0.22;
        const STRAP_LENGTH_RATIOS = { '10cm': 0.72, '20cm': 0.70 };
        const dollScalePresets = {
            'OB11': { canvasSizePx: STANDARD_CANVAS_SIZE_PX, pxPerCm: STANDARD_PX_PER_CM, bodyLeftRatio: 0.3762, bodyTopRatio: 0.2060, strapShoulderXRatio: 0.46, strapShoulderYRatio: 0.43, bagXcm: 3.81, bagYcm: 7.61, bagSizeCm: 3.0, bagRotationDeg: -4 },
            '黏土娃': { canvasSizePx: STANDARD_CANVAS_SIZE_PX, pxPerCm: (STANDARD_CANVAS_SIZE_PX * 0.6306) / 11.1, bodyLeftRatio: 0.3940, bodyTopRatio: 0.2567, strapShoulderXRatio: 0.46, strapShoulderYRatio: 0.47, bagXcm: 3.41, bagYcm: 6.87, bagSizeCm: 3.0, bagRotationDeg: -4 },
            'P9': { canvasSizePx: STANDARD_CANVAS_SIZE_PX, pxPerCm: STANDARD_PX_PER_CM, bodyLeftRatio: 0.3540, bodyTopRatio: 0.2034, strapShoulderXRatio: 0.425, strapShoulderYRatio: 0.455, bagXcm: 3.92, bagYcm: 7.67, bagSizeCm: 3.0, bagRotationDeg: -4 },
            '自訂尺寸': { canvasSizePx: STANDARD_CANVAS_SIZE_PX, pxPerCm: STANDARD_PX_PER_CM, bodyLeftRatio: 0.3762, bodyTopRatio: 0.2060, strapShoulderXRatio: 0.46, strapShoulderYRatio: 0.43, bagXcm: 3.81, bagYcm: 7.61, bagSizeCm: 3.0, bagRotationDeg: -4 },
            '10cm': { canvasSizePx: STANDARD_CANVAS_SIZE_PX, pxPerCm: (STANDARD_CANVAS_SIZE_PX * 0.6708) / 10, bodyLeftRatio: 0.2848, bodyTopRatio: 0.2142, strapShoulderXRatio: 0.300, strapShoulderYRatio: 0.530, bagXcm: 4.95, bagYcm: 7.89, bagSizeCm: 3.0, bagRotationDeg: -4 },
            '20cm': { canvasSizePx: LARGE_CANVAS_SIZE_PX, pxPerCm: (LARGE_CANVAS_SIZE_PX * 0.7823) / 20, bodyLeftRatio: 0.2765, bodyTopRatio: 0.1422, strapShoulderXRatio: 0.283, strapShoulderYRatio: 0.467, bagXcm: 8.96, bagYcm: 14.86, bagSizeCm: 3.0, bagRotationDeg: -4 }
        };
        let bagCalibration = { xCm: 3.35, yCm: 6.70, sizeCm: 3.0, rotationDeg: -4 };
        let activeDollValue = 'OB11';

        const sidebar = document.getElementById('sidebar');
        const mainCategory = document.getElementById('main-category');
        const subCategory = document.getElementById('sub-category');
        const bagStyle = document.getElementById('bag-style');
        const skinFill = document.getElementById('doll-skin-fill');
        const skinPreset = document.getElementById('skin-preset');
        const customSkinRow = document.getElementById('custom-skin-row');
        const customSkinColor = document.getElementById('custom-skin-color');
        const dollMask = document.getElementById('doll-mask');
        const canvas = document.querySelector('.canvas');
        const mobileLayoutMedia = window.matchMedia('(max-width: 768px), (max-width: 1024px) and (pointer: coarse)');

        function toggleSidebar(forceOpen) {
            const open = typeof forceOpen === 'boolean' ? forceOpen : !sidebar.classList.contains('open');
            sidebar.classList.toggle('open', open);
            const mobile = mobileLayoutMedia.matches;
            sidebar.inert = mobile && !open;
            document.querySelector('.display-area').inert = mobile && open;
            document.querySelector('.mobile-header').inert = mobile && open;
            document.getElementById('sidebar-backdrop').hidden = !open;
            document.getElementById('settings-toggle').setAttribute('aria-expanded', String(open));
            fitMobilePreview();
            if (open) sidebar.querySelector('.close-sidebar-btn').focus({ preventScroll: true });
            else document.getElementById('settings-toggle').focus({ preventScroll: true });
        }

        function fitMobilePreview() {
            const viewport = document.querySelector('.canvas-viewport');
            const bagOptions = document.getElementById('bag-options');
            const inlineControls = mobileLayoutMedia.matches && !sidebar.classList.contains('open');
            const bagHost = document.getElementById(inlineControls ? 'mobile-bag-options-host' : 'desktop-bag-options-host');
            if (bagOptions.parentElement !== bagHost) bagHost.appendChild(bagOptions);
            sidebar.inert = mobileLayoutMedia.matches && !sidebar.classList.contains('open');
            if (!mobileLayoutMedia.matches) {
                viewport.style.width = '';
                viewport.style.height = '';
                canvas.style.transform = '';
                canvas.style.removeProperty('--preview-scale');
                if (sidebar.classList.contains('open')) toggleSidebar(false);
                document.querySelector('.display-area').inert = false;
                document.querySelector('.mobile-header').inert = false;
                return;
            }
            const area = document.querySelector('.display-area');
            const style = getComputedStyle(area);
            const availableWidth = area.clientWidth - parseFloat(style.paddingLeft) - parseFloat(style.paddingRight);
            // Scale only the presentation; layer coordinates and cm calibration stay unchanged.
            const scale = Math.min(1, Math.max(0, availableWidth) / canvas.offsetWidth);
            viewport.style.width = `${canvas.offsetWidth * scale}px`;
            viewport.style.height = `${canvas.offsetHeight * scale}px`;
            canvas.style.transform = `scale(${scale})`;
            canvas.style.setProperty('--preview-scale', scale);
        }

        window.addEventListener('resize', fitMobilePreview);
        document.getElementById('mobile-bag-controls').addEventListener('toggle', fitMobilePreview);
        document.addEventListener('keydown', (event) => {
            if (event.key === 'Escape' && !document.querySelector('dialog[open]') && sidebar.classList.contains('open')) {
                toggleSidebar(false);
            }
        });

        function updateSubCategory() {
            const selectedMain = mainCategory.value;
            subCategory.innerHTML = '';
            const opts = selectedMain === '12分' ? ['OB11', '黏土娃', 'P9', '自訂尺寸'] : ['10cm', '20cm'];
            opts.forEach(opt => {
                let el = document.createElement('option'); el.value = opt; el.textContent = opt;
                subCategory.appendChild(el);
            });
            onDollOrBagChange();
        }

        function applySkinColor(color) {
            skinFill.style.backgroundColor = color;
            if (skinPreset.value === 'custom') customSkinColor.value = color;
            dollMask.style.filter = "none";
            if (typeof window.updateCustomBodySkin === 'function') {
                window.updateCustomBodySkin(color);
            }
        }

        function handleSkinPresetChange() {
            const isCustom = skinPreset.value === 'custom';
            customSkinRow.style.display = isCustom ? 'flex' : 'none';
            const presetColors = { normal: '#e3d2b9', white: '#e5dbcc' };
            applySkinColor(isCustom ? customSkinColor.value : presetColors[skinPreset.value]);
        }

        function resetBagCalibrationForDoll() {
            const preset = dollScalePresets[subCategory.value] || dollScalePresets['OB11'];
            bagCalibration = {
                xCm: preset.bagXcm,
                yCm: preset.bagYcm,
                sizeCm: preset.bagSizeCm,
                rotationDeg: preset.bagRotationDeg
            };
        }

        function onDollOrBagChange() {
            const imageMapping = {
                'OB11': 'dolls/body_ob11.png',
                '黏土娃': 'dolls/body_Nendoroid_Doll.png',
                'P9': 'dolls/body_p9.png',
                '10cm': 'dolls/body_10cm.png',
                '20cm': 'dolls/body_20cm.png'
            };
            const isCustomBody = subCategory.value === '自訂尺寸';
            if (!isCustomBody) dollMask.src = imageMapping[subCategory.value];
            dollMask.style.display = isCustomBody ? 'none' : 'block';
            skinFill.style.display = isCustomBody ? 'none' : 'block';
            skinPreset.disabled = false;
            customSkinColor.disabled = false;
            handleSkinPresetChange();
            if (typeof window.setCustomBodyActive === 'function') {
                window.setCustomBodyActive(isCustomBody);
            }
            const preset = dollScalePresets[subCategory.value] || dollScalePresets['OB11'];
            canvas.style.width = `${preset.canvasSizePx}px`;
            canvas.style.height = `${preset.canvasSizePx}px`;
            canvas.style.minWidth = `${preset.canvasSizePx}px`;
            canvas.style.minHeight = `${preset.canvasSizePx}px`;
            fitMobilePreview();
            if (activeDollValue !== subCategory.value) {
                activeDollValue = subCategory.value;
                resetBagCalibrationForDoll();
            }

            renderControlPanel();
            refreshLayers();
            updateReferenceGallery();
        }

        function updateBagCalibration(key, value) {
            bagCalibration[key] = Number(value);
            const valueEl = document.getElementById(`${key}-value`);
            if (valueEl) {
                valueEl.textContent = key === 'rotationDeg' ? `${bagCalibration[key]}°` : `${bagCalibration[key].toFixed(1)} cm`;
            }
            applyBagPlacement();
        }

        function handleCustomBagUpload(file) {
            if (!file) return;
            const uploadVersion = ++customBagUploadVersion;
            if (file.type !== 'image/png' && !(!file.type && /\.png$/i.test(file.name))) {
                customBagUploadError = '請選擇 PNG 圖片。';
                syncCustomBagControls();
                return;
            }
            customBagUploadError = '';
            syncCustomBagControls();
            const nextUrl = URL.createObjectURL(file);
            const image = new Image();
            image.onload = function() {
                if (uploadVersion !== customBagUploadVersion) {
                    URL.revokeObjectURL(nextUrl);
                    return;
                }
                if (customBagUrl) URL.revokeObjectURL(customBagUrl);
                customBagUrl = nextUrl;
                customBagNaturalWidth = image.naturalWidth || image.width;
                customBagNaturalHeight = image.naturalHeight || image.height;
                customBagScale = 1;
                syncCustomBagControls();
                refreshLayers();
            };
            image.onerror = function() {
                URL.revokeObjectURL(nextUrl);
                if (uploadVersion !== customBagUploadVersion) return;
                customBagUploadError = '圖片無法讀取，請重新選擇 PNG 圖片。';
                syncCustomBagControls();
            };
            image.src = nextUrl;
        }

        function getCustomBagSizeCm() {
            return {
                width: (customBagNaturalWidth / 300) * 2.54 * customBagScale,
                height: (customBagNaturalHeight / 300) * 2.54 * customBagScale
            };
        }

        function syncCustomBagControls(editingAxis) {
            const ready = Boolean(customBagUrl && customBagNaturalWidth && customBagNaturalHeight);
            const size = getCustomBagSizeCm();
            ['width', 'height'].forEach((axis) => {
                const input = document.getElementById(`custom-bag-${axis}`);
                if (!input) return;
                input.disabled = !ready;
                if (axis !== editingAxis) input.value = ready ? Number(size[axis].toFixed(2)) : '';
            });
            const toggle = document.getElementById('custom-bag-dimensions-toggle');
            if (toggle) {
                toggle.disabled = !ready;
                toggle.checked = customBagShowDimensions;
            }
            const reset = document.getElementById('custom-bag-reset-size');
            if (reset) reset.disabled = !ready;
            const error = document.getElementById('custom-bag-upload-error');
            if (error) error.textContent = customBagUploadError;
        }

        function updateCustomBagSize(axis, value) {
            const cm = Number(value);
            if (!customBagUrl || !Number.isFinite(cm) || cm < 0.01) return;
            const sourcePixels = axis === 'width' ? customBagNaturalWidth : customBagNaturalHeight;
            customBagScale = cm / ((sourcePixels / 300) * 2.54);
            syncCustomBagControls(axis);
            applyBagPlacement();
        }

        function resetCustomBagSize() {
            customBagScale = 1;
            syncCustomBagControls();
            applyBagPlacement();
        }

        function toggleCustomBagDimensions(enabled) {
            customBagShowDimensions = enabled;
            applyBagPlacement();
        }

        function renderRangeControl(key, label, min, max, step, suffix) {
            const value = bagCalibration[key];
            const display = key === 'rotationDeg' ? `${value}°` : `${value.toFixed(1)} ${suffix}`;
            return `
                <div class="control-group">
                    <div class="range-head">
                        <label for="${key}-range">${label}</label>
                        <span class="range-value" id="${key}-value">${display}</span>
                    </div>
                    <input id="${key}-range" type="range" min="${min}" max="${max}" step="${step}" value="${value}" oninput="updateBagCalibration('${key}', this.value)">
                </div>
            `;
        }

        function renderHardwareControl() {
            return `
                <div class="control-group">
                    <label>五金顏色</label>
                    <select onchange="currentHardware=this.value; refreshLayers();">
                        <option value="hw-gold" ${currentHardware==='hw-gold'?'selected':''}>金</option>
                        <option value="hw-silver" ${currentHardware==='hw-silver'?'selected':''}>銀</option>
                        <option value="hw-bronze" ${currentHardware==='hw-bronze'?'selected':''}>古銅</option>
                        <option value="hw-black" ${currentHardware==='hw-black'?'selected':''}>槍黑</option>
                    </select>
                </div>
            `;
        }

        function renderControlPanel() {
            const panel = document.getElementById('dynamic-options');
            document.getElementById('bag-options').classList.toggle('has-cat-pattern', bagStyle.value === 'cat');
            document.getElementById('custom-bag-disclaimer').hidden = bagStyle.value !== 'custom_upload';
            if (bagStyle.value === 'custom_upload') {
                panel.innerHTML = `
                    <div class="control-group">
                        <label for="custom-bag-upload">上傳 PNG</label>
                        <input id="custom-bag-upload" type="file" accept="image/png" onchange="handleCustomBagUpload(this.files && this.files[0])">
                        <p class="custom-body-note">請上傳透明背景 PNG。建議尺寸 3 x 3 cm、300 dpi。</p>
                        <p id="custom-bag-upload-error" class="custom-bag-error" role="alert"></p>
                    </div>
                    <div class="custom-bag-size-fields">
                        <div class="control-group">
                            <label for="custom-bag-width">寬（cm）</label>
                            <input id="custom-bag-width" type="number" min="0.01" step="0.01" inputmode="decimal" disabled oninput="updateCustomBagSize('width', this.value)" onchange="syncCustomBagControls()">
                        </div>
                        <div class="control-group">
                            <label for="custom-bag-height">高（cm）</label>
                            <input id="custom-bag-height" type="number" min="0.01" step="0.01" inputmode="decimal" disabled oninput="updateCustomBagSize('height', this.value)" onchange="syncCustomBagControls()">
                        </div>
                    </div>
                    <button id="custom-bag-reset-size" class="reset-custom-body" type="button" disabled onclick="resetCustomBagSize()">重置尺寸</button>
                    <div class="custom-bag-preview-row">
                        <label for="custom-bag-dimensions-toggle">尺寸預覽</label>
                        <input id="custom-bag-dimensions-toggle" class="custom-bag-switch" type="checkbox" role="switch" disabled onchange="toggleCustomBagDimensions(this.checked)">
                    </div>
                `;
                syncCustomBagControls();
                return;
            }
            if (bagStyle.value === 'toast') {
                panel.innerHTML = `
                    <div class="control-group">
                        <label>背帶顏色</label>
                        <select onchange="bagStyleConfigs.toast.strapColor=this.value; applyBagPlacement();">
                            <option value="#481502" ${bagStyleConfigs.toast.strapColor==='#481502'?'selected':''}>深咖</option>
                            <option value="#f7d0b7" ${bagStyleConfigs.toast.strapColor==='#f7d0b7'?'selected':''}>原皮</option>
                        </select>
                    </div>
                    ${renderHardwareControl()}
                `;
                return;
            }
            if (bagStyle.value === 'mini_messenger') {
                panel.innerHTML = `
                    <div class="control-group">
                        <label>包包主體顏色</label>
                        <div class="color-palette" id="main-pal"></div>
                    </div>
                    <div class="control-group">
                        <label>五金顏色</label>
                        <select onchange="currentHardware=this.value; refreshLayers();">
                            <option value="hw-gold" ${currentHardware==='hw-gold'?'selected':''}>金</option>
                            <option value="hw-silver" ${currentHardware==='hw-silver'?'selected':''}>銀</option>
                            <option value="hw-bronze" ${currentHardware==='hw-bronze'?'selected':''}>古銅</option>
                            <option value="hw-black" ${currentHardware==='hw-black'?'selected':''}>槍黑</option>
                        </select>
                    </div>
                `;
                buildPalette('main-pal', 'main');
                return;
            }
            if (bagStyle.value === 'cylinder') {
                panel.innerHTML = `
                    <div class="control-group">
                        <label>包包主體顏色</label>
                        <div class="color-palette" id="main-pal"></div>
                    </div>
                    <div class="control-group">
                        <label>五金顏色</label>
                        <select onchange="currentHardware=this.value; refreshLayers();">

        function buildPalette(targetId, type) {
            const target = document.getElementById(targetId);
            if(!target) return;
            const isCustomizable = ['main', 'cylinder', 'tuxedo'].includes(type);
            const getCurrentColor = () => {
                if(type === 'main') return currentMainColor;
                if(type === 'cylinder') return currentCylinderColor;
                if(type === 'tuxedo') return currentTuxedoColor;
                return '#ffffff';
            };
            const setCurrentColor = (hex) => {
                if(type === 'main') { currentMainColor = hex; }
                if(type === 'cylinder') { currentCylinderColor = hex; }
                if(type === 'tuxedo') { currentTuxedoColor = hex; }
            };
            paletteColors.forEach(color => {
                const swatch = document.createElement('div');
                swatch.className = 'color-swatch';
                swatch.style.backgroundColor = color.hex;
                swatch.title = `${color.name} ${color.hex}`;
                
                if(type === 'main' && color.hex === currentMainColor) swatch.classList.add('active');
                if(type === 'cylinder' && color.hex === currentCylinderColor) swatch.classList.add('active');
                if(type === 'tuxedo' && color.hex === currentTuxedoColor) swatch.classList.add('active');

                swatch.onclick = function() {
                    target.querySelectorAll('.color-swatch').forEach(s => s.classList.remove('active'));
                    swatch.classList.add('active');
                    if(type === 'main') { currentMainColor = color.hex; }
                    if(type === 'cylinder') { currentCylinderColor = color.hex; }
                    if(type === 'tuxedo') { currentTuxedoColor = color.hex; }
                    const customInput = target.querySelector('.custom-color-input');
                    if (customInput) customInput.value = color.hex;
                    refreshLayers();
                };
                target.appendChild(swatch);
            });
            if(isCustomizable) {
                const customInput = document.createElement('input');
                customInput.type = 'color';
                customInput.className = 'custom-color-input';
                customInput.value = getCurrentColor();
                customInput.setAttribute('aria-label', type === 'tuxedo' ? '自訂區塊顏色' : '自訂包包顏色');

                const customSwatch = document.createElement('label');
                customSwatch.className = 'color-swatch custom-color-swatch';
                customSwatch.textContent = '自訂';
                customSwatch.title = '自訂顏色';
                if(!paletteColors.some(color => color.hex.toLowerCase() === getCurrentColor().toLowerCase())) {
                    customSwatch.classList.add('active');
                }
                const applyCustomColor = function() {
                    target.querySelectorAll('.color-swatch').forEach(s => s.classList.remove('active'));
                    customSwatch.classList.add('active');
                    setCurrentColor(customInput.value);
                    refreshLayers();
                };
                customInput.addEventListener('input', applyCustomColor);
                customInput.addEventListener('change', applyCustomColor);
                customSwatch.appendChild(customInput);
                target.appendChild(customSwatch);
            }
        }

        const maskImageCache = new Map();

        function loadMaskImage(maskUrl) {
            if (!maskImageCache.has(maskUrl)) {
                maskImageCache.set(maskUrl, new Promise((resolve, reject) => {
                    const image = new Image();
                    image.onload = () => resolve(image);
                    image.onerror = () => reject(new Error(`遮色片載入失敗：${maskUrl}`));
                    image.src = maskUrl;
                }));
            }
            return maskImageCache.get(maskUrl);
        }

        async function setMaskLayer(layer, maskUrl, color) {
            const requestKey = `${maskUrl}|${color}`;
            layer.dataset.maskRequest = requestKey;

            try {
                const image = await loadMaskImage(maskUrl);
                if (layer.dataset.maskRequest !== requestKey) return;

                layer.width = image.naturalWidth || 397;
                layer.height = image.naturalHeight || 316;
                const context = layer.getContext('2d');
                context.clearRect(0, 0, layer.width, layer.height);
                context.drawImage(image, 0, 0, layer.width, layer.height);
                context.globalCompositeOperation = 'source-in';
                context.fillStyle = color;
                context.fillRect(0, 0, layer.width, layer.height);
                context.globalCompositeOperation = 'source-over';
            } catch (error) {
                console.error(error);
            }
        }

        function applyStrapPlacement(preset, bagCenterX, bagCenterY, bagWidth, bagHeight, shoulderAnchor = null) {
            const strap = document.getElementById('layer-strap');
            const styleConfig = bagStyleConfigs[bagStyle.value];
            const strapAnchor = styleConfig.strapAnchor;
            const bagAngle = bagCalibration.rotationDeg * Math.PI / 180;
            const localAnchorX = (strapAnchor.xRatio - 0.5) * bagWidth;
            const localAnchorY = (strapAnchor.yRatio - 0.5) * bagHeight;
            const hardwareX = bagCenterX + (localAnchorX * Math.cos(bagAngle)) - (localAnchorY * Math.sin(bagAngle));
            const hardwareY = bagCenterY + (localAnchorX * Math.sin(bagAngle)) + (localAnchorY * Math.cos(bagAngle));
            const baseShoulderX = shoulderAnchor ? shoulderAnchor.x : preset.canvasSizePx * preset.strapShoulderXRatio;
            const baseShoulderY = shoulderAnchor ? shoulderAnchor.y : preset.canvasSizePx * preset.strapShoulderYRatio;
            const lengthRatio = STRAP_LENGTH_RATIOS[subCategory.value] || 1;
            const shoulderX = hardwareX - ((hardwareX - baseShoulderX) * lengthRatio);
            const shoulderY = hardwareY - ((hardwareY - baseShoulderY) * lengthRatio);
            const deltaX = hardwareX - shoulderX;
            const deltaY = hardwareY - shoulderY;
            const strapWidth = STRAP_WIDTH_CM * preset.pxPerCm;

            strap.style.display = 'block';
            strap.style.left = `${shoulderX}px`;
            strap.style.top = `${shoulderY - (strapWidth / 2)}px`;
            strap.style.width = `${Math.hypot(deltaX, deltaY)}px`;
            strap.style.height = `${strapWidth}px`;
            strap.style.backgroundColor = styleConfig.strapColor || (bagStyle.value === 'cylinder' ? currentCylinderColor : currentMainColor);
            strap.style.transform = `rotate(${Math.atan2(deltaY, deltaX) * 180 / Math.PI}deg)`;
        }

        function applyBagPlacement() {
            const preset = dollScalePresets[subCategory.value] || dollScalePresets['OB11'];
            const styleConfig = bagStyleConfigs[bagStyle.value];
            const pxPerCm = preset.pxPerCm;
            const isCustomUpload = bagStyle.value === 'custom_upload';
            const customSize = getCustomBagSizeCm();
            const widthCm = isCustomUpload ? customSize.width : bagCalibration.sizeCm;
            const heightCm = isCustomUpload ? customSize.height : (widthCm / styleConfig.imageRatio);
            const widthPx = widthCm * pxPerCm;
            const heightPx = heightCm * pxPerCm;
            const originX = preset.canvasSizePx * preset.bodyLeftRatio;
            const originY = preset.canvasSizePx * preset.bodyTopRatio;
            const customAnchors = subCategory.value === '自訂尺寸' && typeof window.getCustomBodyAnchors === 'function'
                ? window.getCustomBodyAnchors()
                : null;
            const bagCenterX = customAnchors ? customAnchors.hip.x : originX + (bagCalibration.xCm * pxPerCm);
            const bagCenterY = customAnchors ? customAnchors.hip.y : originY + (bagCalibration.yCm * pxPerCm);
            const leftPx = bagCenterX - (widthPx / 2);
            const topPx = bagCenterY - (heightPx / 2);
            const layerIds = [
                'layer-main-color',
                'layer-tuxedo-color',
                'layer-calico',
                'layer-main-line',
                'layer-tuxedo-line',
                'layer-face',
                'layer-hardware'
            ];

            layerIds.forEach(id => {
                const layer = document.getElementById(id);
                layer.style.width = `${widthPx}px`;
                layer.style.height = `${heightPx}px`;
                layer.style.left = `${leftPx}px`;
                layer.style.top = `${topPx}px`;
                layer.style.transform = `rotate(${bagCalibration.rotationDeg}deg)`;
            });

            const measure = document.getElementById('custom-bag-measure');
            measure.hidden = !(isCustomUpload && customBagUrl && customBagShowDimensions);
            if (!measure.hidden) {
                measure.style.width = `${widthPx}px`;
                measure.style.height = `${heightPx}px`;
                measure.style.left = `${leftPx}px`;
                measure.style.top = `${topPx}px`;
                measure.style.transform = `rotate(${bagCalibration.rotationDeg}deg)`;
                document.getElementById('custom-bag-width-label').textContent = `${Number(widthCm.toFixed(2))} cm`;
                document.getElementById('custom-bag-height-label').textContent = `${Number(heightCm.toFixed(2))} cm`;
            }

            if (isCustomUpload) {
                const strap = document.getElementById('layer-strap');
                if (strap) strap.style.display = 'none';
                return;
            }

            applyStrapPlacement(
                preset,
                bagCenterX,
                bagCenterY,
                widthPx,
                heightPx,
                customAnchors ? customAnchors.shoulder : null
            );
        }

        function refreshLayers() {
            // 著色底層 DOM
            const lMainColor = document.getElementById('layer-main-color');
            const lTuxColor = document.getElementById('layer-tuxedo-color');
            const lCalico = document.getElementById('layer-calico');
            
            // 頂層黑色線稿 DOM
            const lMainLine = document.getElementById('layer-main-line');
            const lTuxLine = document.getElementById('layer-tuxedo-line');
            const lFace = document.getElementById('layer-face');
            const lHardware = document.getElementById('layer-hardware');
            lHardware.style.display = 'block';

            if (bagStyle.value === 'custom_upload') {
                lMainColor.style.display = 'none';
                lTuxColor.style.display = 'none';
                lCalico.style.display = 'none';
                lFace.style.display = 'none';
                lHardware.style.display = 'none';
                lTuxLine.style.display = 'none';
                lMainLine.style.display = customBagUrl ? 'block' : 'none';
                lMainLine.className = 'bag-layer';
                lMainLine.src = customBagUrl || '';
                applyBagPlacement();
                return;
            }

            if (bagStyle.value === 'toast') {
                lMainColor.style.display = 'none';
                lTuxColor.style.display = 'none';
                lCalico.style.display = 'none';
                lFace.style.display = 'none';
                lMainLine.style.display = 'block';
                lMainLine.className = 'bag-layer';
                lMainLine.src = 'bags/toast/toast_line.png';
                lTuxLine.style.display = 'block';
                lTuxLine.className = 'bag-layer lineart-overlay';
                lTuxLine.src = 'bags/toast/toast_hardware_line.png';
                setMaskLayer(lHardware, 'bags/toast/toast_hardware_mask.png', hardwareColors[currentHardware]);
                applyBagPlacement();
                return;
            }

            if (bagStyle.value === 'mini_messenger') {
                lMainColor.style.display = 'block';
                setMaskLayer(lMainColor, 'bags/mini_messenger/mini_messenger_base_mask.png', currentMainColor);
                lTuxColor.style.display = 'none';
                lCalico.style.display = 'none';
                lFace.style.display = 'none';
                lMainLine.style.display = 'block';
                lMainLine.className = 'bag-layer lineart-overlay';
                lMainLine.src = 'bags/mini_messenger/mini_messenger_line.png';
                lTuxLine.style.display = 'block';
                lTuxLine.className = 'bag-layer lineart-overlay';
                lTuxLine.src = 'bags/mini_messenger/mini_messenger_hardware_line.png';
                setMaskLayer(lHardware, 'bags/mini_messenger/mini_messenger_hardware_mask.png', hardwareColors[currentHardware]);
                applyBagPlacement();
                return;
            }

            if (bagStyle.value === 'cylinder') {
                lMainColor.style.display = 'block';
                setMaskLayer(lMainColor, 'bags/cylinder/cylinder_base_mask.png', currentCylinderColor);
                lTuxColor.style.display = 'none';
                lCalico.style.display = 'none';
                lFace.style.display = 'none';
                lMainLine.style.display = 'block';
                lMainLine.className = 'bag-layer lineart-overlay';
                lMainLine.src = 'bags/cylinder/cylinder_line.png';
                lTuxLine.style.display = 'block';
                lTuxLine.className = 'bag-layer lineart-overlay';
                lTuxLine.src = 'bags/cylinder/cylinder_hardware_line.png';
                setMaskLayer(lHardware, 'bags/cylinder/cylinder_hardware_mask.png', hardwareColors[currentHardware]);
                applyBagPlacement();
                return;
            }

            const imgPath = 'bags/cat/';

            // 主體底色遮色片與共用線稿
            lMainColor.style.display = 'block';
            setMaskLayer(lMainColor, `${imgPath}cat_base_mask.png`, currentMainColor);
            lMainLine.style.display = 'block';
            lMainLine.className = 'bag-layer lineart-overlay';
            lMainLine.src = `${imgPath}cat_line.png`;

            lTuxColor.style.display = 'none';
            lTuxLine.style.display = 'none';
            lTuxLine.className = 'bag-layer lineart-overlay';
            lCalico.style.display = 'none';

            if (currentCatPattern === 'tuxedo') {
                lTuxColor.style.display = 'block';
                setMaskLayer(lTuxColor, `${imgPath}cat_tuxedo_mask.png`, currentTuxedoColor);
                lTuxLine.style.display = 'block';
                lTuxLine.src = `${imgPath}cat_tuxedo_line.png`;
            } else if (currentCatPattern === 'calico') {
                lCalico.style.display = 'block';
                lCalico.src = `${imgPath}cat_calico.png`;
            }

            // 3. 表情加工變色（利用覆蓋全網頁支援的精準反轉色矩陣）
            if (currentExpression === 'face-none') {
                lFace.style.display = 'none';
            } else {
                lFace.style.display = 'block';
                lFace.src = `${imgPath}cat_face_black.png`;
                lFace.className = `bag-layer ${currentExpression}`;
            }

            // 4. 五金遮色片換色
            lHardware.className = 'bag-layer';
            setMaskLayer(lHardware, `${imgPath}cat_hardware_mask.png`, hardwareColors[currentHardware]);

            applyBagPlacement();
        }

        window.onload = function() {
            updateSubCategory();
            handleSkinPresetChange();
        }
    </script>

        creatorDialog.addEventListener('click', (event) => {
            if (event.target !== creatorDialog) return;
            const bounds = creatorDialog.getBoundingClientRect();
            if (event.clientX < bounds.left || event.clientX > bounds.right || event.clientY < bounds.top || event.clientY > bounds.bottom) {
